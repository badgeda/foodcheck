name: Build FoodCheck Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "icon-192.png"
      - "icon-512.png"
      - "icon.svg"
      - "manifest.webmanifest"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore FoodCheck release signing key
        env:
          FOODCHECK_RELEASE_KEYSTORE_BASE64: ${{ secrets.FOODCHECK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOODCHECK_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/foodcheck-signing"
          printf '%s' "$FOODCHECK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodcheck-signing/foodcheck-release.keystore"
          test -s "$RUNNER_TEMP/foodcheck-signing/foodcheck-release.keystore"

      - name: Configure release signing
        working-directory: android
        env:
          FOODCHECK_KEYSTORE_PATH: ${{ runner.temp }}/foodcheck-signing/foodcheck-release.keystore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          if "signingConfigs" in s:
              raise SystemExit("Signing config already exists; refusing to patch unexpectedly")
          pattern = r"    buildTypes\s*\{\s*release\s*\{"
          replacement = """    signingConfigs {
        release {
            storeFile file(System.getenv("FOODCHECK_KEYSTORE_PATH"))
            storePassword System.getenv("FOODCHECK_RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("FOODCHECK_RELEASE_KEY_ALIAS")
            keyPassword System.getenv("FOODCHECK_RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release"""
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not locate standard Android release buildType")
          p.write_text(s2)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          FOODCHECK_KEYSTORE_PATH: ${{ runner.temp }}/foodcheck-signing/foodcheck-release.keystore
          FOODCHECK_RELEASE_STORE_PASSWORD: ${{ secrets.FOODCHECK_RELEASE_STORE_PASSWORD }}
          FOODCHECK_RELEASE_KEY_PASSWORD: ${{ secrets.FOODCHECK_RELEASE_KEY_PASSWORD }}
          FOODCHECK_RELEASE_KEY_ALIAS: ${{ secrets.FOODCHECK_RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodCheck-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
